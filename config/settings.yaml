system:
  project_name: Macro Regime Portfolio Engine
  version: local-1.0.13-valuation-guardrails
  random_seed: 42
portfolio:
  base_currency: USD
  benchmark: SPY
  initial_nav: 1000000
  allow_short: false
  max_stock_weight: 0.1
  max_sector_weight: 0.3
  max_risky_sector_share: 0.7
  min_eligible_sectors_for_risky_cap: 2
  min_cash_weight: 0.0
  # Post-solve weights below this are zeroed (optimizer residue / non-executable
  # positions such as BF.B 3.8e-8 and DLTR 0.4% in the 2026-11-11 run).
  optimizer_weight_epsilon: 0.005
universe:
  membership_mode: LIVE_ONLY_CURRENT_MEMBERSHIP
  http_timeout_seconds: 30
  resilience:
    allow_bundled_soxx_fallback: true
    bundled_soxx_snapshot_date: 2026-09-29
    warn_if_bundled_snapshot_older_than_days: 90
  sources:
    sp500:
      enabled: true
      role: CORE
    nasdaq100:
      enabled: true
      role: GROWTH_OVERLAY
    soxx:
      enabled: true
      role: SEMICONDUCTOR_SPECIALIST_OVERLAY
  liquidity:
    min_adv20_usd: 20000000
    min_price_usd: 3.0
    adv_window: 20
  research_funnel:
    deep_valuation_target_min: 30
    deep_valuation_max_total: 60
    max_per_core_sector: 20
    max_per_tactical_sector: 15
    min_selection_confidence: 0.6
    min_market_cap_usd: 5000000000
    soxx_min_deep_names_when_xlk_active: 8
execution:
  transaction_cost_bps: 10.0
  transaction_cost_rate: 0.001
  min_trade_weight: 0.005
  max_adv_participation: 0.1
  portfolio_state_mode: MODEL
  assume_model_targets_executed: true
risk:
  trading_days: 252
  var_confidence: 0.99
  cvar_confidence: 0.99
  target_volatility: null
  covariance_method: ledoit_wolf
  missing_return_warning_threshold: 0.02
  path_mc_simulations: 20000
  path_mc_block_length: 5
  path_mc_chunk_size: 2000
  lookback_days: 756
  min_observations: 252
  stress_window: 126
  base_cov_weight: 0.8
  stress_cov_weight: 0.2
  max_missing_share: 0.15
  gaussian_mc_simulations: 50000
  market_source_min_overlap_ratio: 0.7
  market_source_min_overlap_count: 3
  common_date_coverage_ratio: 0.9
valuation:
  forecast_years: 5
  gordon_growth_weight: 0.7
  terminal_multiple_weight: 0.3
  default_margin_of_safety: 0.15
  margin_of_safety: 0.15
  mos_base: 0.15
  mos_confidence_sensitivity: 0.1
  mos_min: 0.1
  mos_max: 0.3
  min_broad_peer_universe: 80
  scenario_probabilities:
    BEAR: 0.25
    BASE: 0.5
    BULL: 0.25
  min_r_minus_g: 0.015
  max_terminal_value_share: 0.9
  large_scenario_upside: 3.0
  f9_forward_weight: 0.55
  f9_expectations_weight: 0.25
  f9_relative_weight: 0.2
  f9_forward_scale: 0.25
  financial_payout_diagnostic:
    min_source_company_coverage: 8
    large_payout_gap: 0.3
    extreme_payout_low: -0.5
    extreme_payout_high: 1.5
    recent_years: 3
    material_improvement_threshold: 0.1
    large_remaining_gap: 0.5
    extreme_gross_payout: 2.0
    anchor_lower_bound: 0.0
    anchor_upper_bound: 2.0
  peer_engine:
    narrow_min_peers_same_sector_model: 2
    narrow_min_peers_same_sector_metric: 3
    narrow_min_peers_same_model: 2
    narrow_min_peers_broad_metric: 3
    broad_min_subindustry_peers: 2
    broad_preferred_subindustry_peers: 3
    broad_max_peers: 7
    broad_similarity_peers: 5
    current_multiple_bounds:
      EV_EBITDA:
      - 2.0
      - 60.0
      PRICE_BOOK:
      - 0.25
      - 12.0
      PRICE_EARNINGS:
      - 4.0
      - 100.0
    terminal_multiple_bounds:
      EV_EBITDA:
      - 4.0
      - 30.0
      PRICE_BOOK:
      - 0.5
      - 6.0
      PRICE_EARNINGS:
      - 8.0
      - 40.0
    scenario_multipliers:
      BEAR: 0.9
      BASE: 1.0
      BULL: 1.1
    narrow_source_quality:
      SAME_SECTOR_SAME_MODEL: 1.0
      SAME_SECTOR_SAME_METRIC: 0.9
      SAME_EXECUTION_MODEL: 0.85
      BROAD_SAME_METRIC: 0.75
    broad_source_quality:
      SUBINDUSTRY_3PLUS: 1.0
      SUBINDUSTRY_2: 0.9
      SECTOR_SIMILARITY: 0.8
      BROAD_SIMILARITY: 0.65
    large_anchor_change_threshold: 0.3
  terminal_guardrail:
    low_confidence_threshold: 0.7
    low_quality_sources:
    - SUBINDUSTRY_2
    - SECTOR_SIMILARITY
    - BROAD_SIMILARITY
    min_anchor_to_current: 0.5
    max_anchor_to_current: 2.0
  anomaly_gate:
    iv_price_ratio_min: 0.2
    iv_price_ratio_max: 3.0
    consensus_review_divergence: 0.4
    consensus_critical_divergence: 0.75
    block_critical_new_entries: true
  security_overrides:
    TSM:
      security_type: ADR
      underlying_per_listed_unit: 5.0
      expected_financial_currency: TWD
      expected_price_currency: USD
      source_note: 'TSMC official ADR program: 1 ADR represents 5 ordinary shares'
