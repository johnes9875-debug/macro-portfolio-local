data:
  historical_start: '2000-01-01'
  update_overlap_days: 5
optimizer:
  risk_aversion: 5.0
  turnover_penalty: 1.0
alpha:
  sector_weight: 0.3
  company_weight: 0.35
  valuation_weight: 0.35
  alpha_return_per_signal: 0.05
  max_abs_annual_alpha: 0.1
  min_reasonable_expected_return: -0.1
  max_reasonable_expected_return: 0.35
  sharpe_fragility_threshold: 0.1
  cash_fragility_threshold: 0.1
monitoring:
  near_buy_zone: 0.05
  watch_buy_zone: 0.1
  stock_cap_alert_ratio: 0.95
  sector_cap_alert_ratio: 0.95
  risk_contribution_alert: 0.3
  high_cash_alert: 0.5
  market_shocks:
    MARKET_UP_10: 0.1
    MARKET_DOWN_5: -0.05
    MARKET_DOWN_10: -0.1
    MARKET_DOWN_20: -0.2
  price_change_alert: 0.05
  mos_distance_change_alert: 0.05
  weight_change_alert: 0.01
  max_snapshot_folders: 120
  alpha_rank_drift_alert: 5
  alpha_score_drift_alert: 0.5
  mos_distance_drift_alert: 0.1
  target_weight_drift_alert: 0.03
  valuation_price_drift_alert: 0.1
  portfolio_surprise_alert: 0.03
  min_performance_periods_for_stats: 5
  auto_show_dashboard: false
diagnostics:
  regime_backtest:
    publication_lag_days: 45
    min_history_months: 36
    rebalance: M
    growth_series_count: 2
    inflation_series_count: 2
local:
  market_calendar: NYSE
  minutes_after_close: 30
  scheduler_check_minutes: 60
  dashboard_port: 8501
  dashboard_host: 127.0.0.1
  archive_key_outputs: true
  max_archived_runs: 180
  run_section_l_on_daily_close: false
  # Run ledger (ledger/): record every successful run; optionally git-push it.
  record_ledger: true
  auto_push_ledger: true
